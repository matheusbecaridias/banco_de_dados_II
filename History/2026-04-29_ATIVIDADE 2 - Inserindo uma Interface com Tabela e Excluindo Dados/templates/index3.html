<!doctype html>
<html lang="pt-br">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Produtos</title>
  </head>
  <body>
    <h1>Cadastro de Produtos</h1>

    <form action="/cadastrar" method="post">
      <label for="c_produto">PRODUTO</label>
      <input
        type="text"
        name="produto"
        id="c_produto"
        placeholder="Nome do produto"
        required
      />

      <label for="c_categoria">CATEGORIA</label>
      <input
        type="text"
        name="categoria"
        id="c_categoria"
        placeholder="Categoria do produto"
        required
      />

      <label for="c_preco">PREÇO</label>
      <input
        type="number"
        name="preco"
        id="c_preco"
        placeholder="0.00"
        min="0"
        step="0.01"
        required
      />

      <label for="c_estoque">ESTOQUE</label>
      <input
        type="number"
        name="estoque"
        id="c_estoque"
        placeholder="0"
        min="0"
        required
      />

      <button type="submit">CADASTRAR</button>
    </form>

    <h2>Lista de Produtos</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Produto</th>
          <th>Categoria</th>
          <th>Preço</th>
          <th>Estoque</th>
        </tr>
      </thead>
      <tbody>
        {% for produto in produtos %}
        <tr>
          <td>{{ produto.ID }}</td>
          <td>{{ produto.PRODUTO }}</td>
          <td>{{ produto.CATEGORIA }}</td>
          <td>{{ produto.PRECO }}</td>
          <td>{{ produto.ESTOQUEcliente }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </body>
</html>
